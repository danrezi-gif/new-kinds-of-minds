<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Kinds of Minds — BRAIN prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010204;color:#f8f5ec;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;inset:0;padding:clamp(18px,3vw,48px);display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.k{font-size:10px;letter-spacing:.32em;text-transform:uppercase;opacity:.55}.title{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(30px,5vw,72px);line-height:.92;letter-spacing:-.04em;max-width:11ch;margin:.12em 0 0}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}.phase{color:#f4d58d;font-size:10px;letter-spacing:.28em;text-transform:uppercase}.note{font-family:Georgia,"Times New Roman",serif;font-size:clamp(18px,2.1vw,30px);opacity:.78;margin-top:8px}.item{font-size:12px;opacity:.48;margin-top:16px;border-left:1px solid #ffffff44;padding-left:10px;max-width:44ch}.item b{color:#fff;font-weight:400}.buttons{display:flex;gap:8px;pointer-events:auto}
button{border:1px solid #ffffff35;border-radius:999px;background:#0006;color:#fffc;padding:10px 14px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;backdrop-filter:blur(8px)}
.status{position:fixed;inset:0;display:grid;place-items:center;color:#fff8;font-size:12px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
@media(max-width:600px){.bottom{align-items:flex-start;flex-direction:column}.buttons{align-self:flex-end}.title{font-size:38px}}
</style></head><body>
<canvas id="c"></canvas><div id="status" class="status">Loading atlas data…</div>
<div class="ui"><div><div class="k">New Kinds of Minds</div><h1 class="title">A planetary atlas of cognitive possibility</h1></div>
<div class="bottom"><div><div id="phase" class="phase">A QUIET WORLD</div><div id="note" class="note">At first, almost nothing.</div><div id="item" class="item"></div></div>
<div class="buttons"><button id="pause">Pause</button><button id="restart">Restart</button></div></div></div>
<script>
const LOOP=56000,PAL=["#f4d58d","#8fd3ff","#c8a7ff","#9be7c4","#f0a7a0","#f6e7c1","#8ad8d1","#d8b4fe"];
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),phaseEl=document.getElementById("phase"),noteEl=document.getElementById("note"),itemEl=document.getElementById("item"),statusEl=document.getElementById("status");
let pts=[],start=performance.now(),paused=false,frozen=0,highlight=0,lastPhase="",lastHi=0;
function hash(s,salt=0){let h=2166136261^salt;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}
function sm(a,b,x){let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)} function lp(a,b,t){return a+(b-a)*t}
function bp(id){for(let n=0;n<18;n++){let x=hash(id,100+n*7)*2-1,y=hash(id,200+n*11)*2-1,top=y<.2;let l=((x+.32)/.72)**2+((y+.02)/(top?.82:.68))**2<1,r=((x-.32)/.72)**2+((y+.02)/(top?.82:.68))**2<1,notch=y>.52&&Math.abs(x)<.14;if((l||r)&&!notch)return{x:x*.92,y:y*.82-.05}}return{x:(hash(id,901)*2-1)*.65,y:(hash(id,902)*2-1)*.5-.05}}
function ph(t){if(t<.16)return["A QUIET WORLD","At first, almost nothing."];if(t<.34)return["EMERGENCE","Points appear. Real projects."];if(t<.52)return["CONNECTIONS","Affinities begin to exceed borders."];if(t<.72)return["THE FOLD","Geography gives way to another topology."];if(t<.92)return["A BRAIN EMERGES","The same humanity. A different map."];return["RETURN","There is no single map of minds."]}
function outline(cx,cy,s,a){if(a<=0)return;ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.globalAlpha=a;ctx.strokeStyle="rgba(244,213,141,.9)";ctx.lineWidth=.007;ctx.shadowColor="rgba(244,213,141,.8)";ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(0,.72);ctx.bezierCurveTo(-.18,.76,-.15,.62,-.26,.58);ctx.bezierCurveTo(-.7,.62,-.95,.33,-.91,.02);ctx.bezierCurveTo(-1.02,-.25,-.78,-.66,-.45,-.67);ctx.bezierCurveTo(-.3,-.91,-.03,-.88,0,-.7);ctx.bezierCurveTo(.08,-.9,.39,-.89,.5,-.67);ctx.bezierCurveTo(.84,-.65,1.01,-.28,.9,.02);ctx.bezierCurveTo(.98,.35,.68,.62,.27,.58);ctx.bezierCurveTo(.16,.63,.19,.76,0,.72);ctx.stroke();ctx.globalAlpha=a*.55;ctx.beginPath();ctx.moveTo(0,-.69);ctx.bezierCurveTo(-.04,-.4,.05,-.18,-.01,.08);ctx.bezierCurveTo(-.06,.3,.04,.48,0,.66);ctx.stroke();ctx.lineWidth=.004;ctx.strokeStyle="rgba(143,211,255,.75)";ctx.shadowColor="rgba(143,211,255,.7)";for(let i=0;i<13;i++){let side=i%2===0?-1:1,y=-.56+(i%7)*.18,w=(i%3)*.035;ctx.beginPath();ctx.moveTo(side*.08,y);ctx.bezierCurveTo(side*(.25+w),y-.12,side*(.44+w),y+.13,side*.68,y+.02);ctx.bezierCurveTo(side*.82,y-.04,side*.77,y+.18,side*.55,y+.2);ctx.stroke()}ctx.restore()}
function resize(){let d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);return[w,h]}
function draw(now){let [w,h]=resize(),elapsed=paused?frozen:now,t=((elapsed-start)%LOOP)/LOOP,p=ph(t);if(p[0]!==lastPhase){lastPhase=p[0];phaseEl.textContent=p[0];noteEl.textContent=p[1]}
let bg=ctx.createRadialGradient(w*.52,h*.48,0,w*.52,h*.48,Math.max(w,h)*.72);bg.addColorStop(0,"#0a1118");bg.addColorStop(.55,"#05080d");bg.addColorStop(1,"#010204");ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
let cx=w*.5,cy=h*.5,gr=Math.min(w,h)*.33,bs=Math.min(w,h)*.36,fold=sm(.49,.78,t),ret=sm(.92,.995,t),m=fold*(1-ret),em=sm(.1,.32,t),net=sm(.28,.5,t)*(1-sm(.88,.97,t)),gl=sm(.62,.82,t)*(1-sm(.92,1,t)),rot=t*Math.PI*1.45-.5;
ctx.save();ctx.globalAlpha=(1-m)*(.18+em*.18);ctx.strokeStyle="rgba(143,211,255,.6)";ctx.lineWidth=1;ctx.shadowColor="rgba(143,211,255,.5)";ctx.shadowBlur=14;ctx.beginPath();ctx.arc(cx,cy,gr,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;for(let i=-2;i<=2;i++){ctx.globalAlpha=(1-m)*.05;ctx.beginPath();ctx.ellipse(cx,cy+i*gr*.23,gr*Math.sqrt(Math.max(.05,1-(i*.23)**2)),gr*.16,0,0,Math.PI*2);ctx.stroke()}ctx.restore();
let pos=pts.map(q=>{let lat=q.lat*Math.PI/180,lon=q.lng*Math.PI/180+rot,z=Math.cos(lat)*Math.cos(lon),gx=cx+gr*Math.cos(lat)*Math.sin(lon),gy=cy-gr*Math.sin(lat),bx=cx+q.bx*bs,by=cy+q.by*bs;return{x:lp(gx,bx,m),y:lp(gy,by,m),v:lp(z>-.06?1:.08,1,m),q}});
if(net>.02){ctx.save();ctx.globalCompositeOperation="lighter";for(let i=0;i<pos.length;i++){let a=pos[i],j=(i+1+Math.floor(a.q.b*17))%pos.length,b=pos[j];if(a.q.type!==b.q.type&&a.q.focus!==b.q.focus)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),mx=lp(gr*.55,bs*.72,m);if(d>mx)continue;let al=net*a.v*b.v*(1-d/mx)*(.12+m*.2);ctx.strokeStyle="rgba(143,211,255,"+al+")";ctx.lineWidth=.55+m*.4;ctx.beginPath();ctx.moveTo(a.x,a.y);let bend=(a.q.c-.5)*34;ctx.quadraticCurveTo((a.x+b.x)/2-dy*.06+bend,(a.y+b.y)/2+dx*.06,b.x,b.y);ctx.stroke()}ctx.restore()}
outline(cx,cy,bs,gl*.72);
ctx.save();ctx.globalCompositeOperation="lighter";pos.forEach((q,i)=>{let intro=sm(.08+q.q.a*.16,.2+q.q.a*.18,t),al=Math.max(.02,intro)*q.v*(.42+m*.42),r=(i===highlight?3.2:1.1+q.q.c*1.3)*(.8+m*.35);ctx.shadowColor=q.q.color;ctx.shadowBlur=i===highlight?22:8+m*7;ctx.fillStyle=q.q.color;ctx.globalAlpha=al;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();if(i===highlight&&intro>.5){ctx.globalAlpha=.6;ctx.strokeStyle="#fff3cf";ctx.lineWidth=1;ctx.beginPath();ctx.arc(q.x,q.y,8+Math.sin(now/500)*2,0,Math.PI*2);ctx.stroke()}});ctx.restore();
if(t>.5&&t<.79){let f=sm(.5,.79,t);ctx.save();ctx.globalCompositeOperation="lighter";ctx.strokeStyle="rgba(244,213,141,"+(.14+.2*Math.sin(f*Math.PI))+")";ctx.lineWidth=2;ctx.shadowColor="rgba(244,213,141,.8)";ctx.shadowBlur=24;ctx.beginPath();ctx.moveTo(cx-bs*.95,cy+bs*.48);ctx.bezierCurveTo(cx-bs*.42,cy-bs*.92,cx+bs*.3,cy+bs*.78,cx+bs*.9,cy-bs*.42);ctx.stroke();ctx.restore()}
if(now-lastHi>3200&&pts.length){lastHi=now;highlight=(highlight+37)%pts.length;let q=pts[highlight];itemEl.innerHTML="<b>"+esc(q.name)+"</b><br>"+esc((q.region||"")+(q.country?" · "+q.country:"")+" · "+q.type.replaceAll("-"," "))}
requestAnimationFrame(draw)}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.getElementById("pause").onclick=()=>{if(paused){start+=performance.now()-frozen;paused=false;document.getElementById("pause").textContent="Pause"}else{frozen=performance.now();paused=true;document.getElementById("pause").textContent="Play"}};
document.getElementById("restart").onclick=()=>{start=performance.now();frozen=start;highlight=0};
fetch("data/initiatives.json").then(r=>r.json()).then(data=>{let arr=Array.isArray(data)?data:(data.initiatives||data.items||[]),types=[...new Set(arr.map(x=>x.type))];pts=arr.filter(x=>Number.isFinite(+x.lat)&&Number.isFinite(+(x.lng??x.lon))).map(x=>{let id=String(x.id||x.name),b=bp(id);return{name:x.name||"Unnamed initiative",region:x.region||x.city||"",country:x.country_name||x.country||"",type:x.type||"initiative",focus:(x.focus&&x.focus[0])||"",lat:+x.lat,lng:+(x.lng??x.lon),a:hash(id,1),b:hash(id,2),c:hash(id,3),bx:b.x,by:b.y,color:PAL[Math.max(0,types.indexOf(x.type))%PAL.length]}});statusEl.style.display="none";if(pts.length){let q=pts[0];itemEl.innerHTML="<b>"+esc(q.name)+"</b><br>"+esc((q.region||"")+(q.country?" · "+q.country:"")+" · "+q.type.replaceAll("-"," "))}}).catch(e=>{statusEl.textContent="Could not load atlas data";console.error(e)});
requestAnimationFrame(draw);
</script></body></html>
